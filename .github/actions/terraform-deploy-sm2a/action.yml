name: Deploy SM2A

inputs:
  env_aws_secret_name:
    required: true
    type: string
  env-file:
    type: string
    default: ".env"
  dir:
    required: false
    type: string
    default: "."
  aws-region:
    required: false
    type: string
    default: "us-west-2"
  script_path:
    type: string
  backend_stack_name:
    type: string
  auth_stack_name:
    type: string


runs:
  using: "composite"

  steps:
    - name: Set up Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"
  
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@ed3a0531877aca392eb870f440d9ae7aba83a6bd #v1.4.0
      with:
        terraform_version: 1.3.10

    - name: Test 🧪
      working-directory: "veda-data-airflow"
      shell: bash
      run: |
        uv sync --all-groups
        export AIRFLOW_HOME=/tmp
        uv run airflow db migrate
        uv run pytest

    - name: Deploy
      working-directory: ${{ inputs.dir }}
      shell: bash
      env:
        AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        # Activate uv venv
        source ../.venv/bin/activate
        make sm2a-deploy ENV_FILE=${{ inputs.env-file }} SECRET_NAME=${{ inputs.env_aws_secret_name }}

    - name: Output workflows API endpoint
      id: output_sm2a_workflows_endpoint
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        cd ./infrastructure
        terraform output -json Airflow_url > ${HOME}/output_sm2a_workflows_endpoint.json
