name: Deploy SM2A

inputs:
  env_aws_secret_name:
    required: true
    type: string
  env-file:
    type: string
    default: ".env"
  dir:
    required: false
    type: string
    default: "."
  aws-region:
    required: false
    type: string
    default: "us-west-2"
  script_path:
    type: string
  backend_stack_name:
    type: string
  auth_stack_name:
    type: string
  run_command:
    default: 'apply'
    type: choice
    options:
    - plan
    - apply

concurrency: ${{ inputs.env_aws_secret_name }}

runs:
  using: "composite"

  steps:
    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@ed3a0531877aca392eb870f440d9ae7aba83a6bd #v1.4.0
      with:
        terraform_version: 1.3.10

    - name: Plan
      working-directory: ${{ inputs.dir }}
      shell: bash
      if: ${{ inputs.run_command == 'plan' }}
      env:
        AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        make sm2a-plan ENV_FILE=${{ inputs.env-file }} SECRET_NAME=${{ inputs.env_aws_secret_name }}

    - name: Deploy
      working-directory: ${{ inputs.dir }}
      shell: bash
      if: ${{ inputs.run_command == 'apply' }}
      env:
        AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        make sm2a-deploy ENV_FILE=${{ inputs.env-file }} SECRET_NAME=${{ inputs.env_aws_secret_name }}

    - name: Output workflows API endpoint
      id: output_sm2a_workflows_endpoint
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        cd ./infrastructure
        terraform output -json Airflow_url > ${HOME}/output_sm2a_workflows_endpoint.json
