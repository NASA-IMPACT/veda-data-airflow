version: 2

# Notes
# - Airflow core (apache-airflow / -core / -task-sdk and the apache/airflow base image) is
#   intentionally ignored. Airflow upgrades must move pyproject.toml, uv.lock, the Dockerfile
#   FROM tags, ARG AIRFLOW_VERSION and the Terraform default together, so they are done by hand.
# - Security updates do not use version-update groups; each ecosystem has its own
#   `applies-to: security-updates` group so advisories arrive as one PR instead of one per package.
# - Groups are matched in order: a dependency lands in the first group it matches.
#   Major runtime bumps intentionally fall through as individual PRs so they can be reviewed alone.

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "apache-airflow"
      - dependency-name: "apache-airflow-core"
      - dependency-name: "apache-airflow-task-sdk"
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
      airflow-providers:
        patterns:
          - "apache-airflow-providers-*"
        update-types:
          - minor
          - patch
      dev-tooling:
        patterns:
          - "pytest*"
          - "coverage"
          - "moto"
          - "pre-commit"
          - "requests-mock"
          - "mypy-boto3-*"
          - "virtualenv"
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: docker
    directories:
      - /airflow_services
      - /airflow_worker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Pinned in lockstep with ARG AIRFLOW_VERSION; bump by hand.
      - dependency-name: "apache/airflow"
      - dependency-name: "ghcr.io/osgeo/gdal"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: terraform
    directories:
      - /infrastructure
      - /infrastructure/rds_backups
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps):"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"
