name: CICD 🚀

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - dev
      - production
    types: [ opened, reopened, edited, synchronize ]

jobs:
  test-dags:
    name: Test Airflow DAGs 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        name: Setup uv
        with:
          enable-cache: true

      - name: Run uv sync
        run: uv sync --locked --all-groups

      - name: Test Airflow DAGs
        run: |
          export AIRFLOW_HOME=/tmp
          uv run airflow db migrate
          uv run pytest

  plan:
    name: 'Run `terraform plan` against development environment'
    runs-on: ubuntu-latest
    needs: [test-dags]
    environment: development
    concurrency: development
    permissions:
      id-token: write # Required to request OIDC token for use with AWS

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: "true"
          submodules: "recursive"
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          role-session-name: "veda-airflow-github-development-planner"
          aws-region: us-west-2

      - name: Plan Changes
        uses: "./.github/actions/terraform-deploy-sm2a"
        with:
          dir: .
          env_aws_secret_name: ${{ vars.SM2A_ENVS_DEPLOYMENT_SECRET_NAME }}
          env-file: .env
          aws-region: us-west-2
          run_command: plan
