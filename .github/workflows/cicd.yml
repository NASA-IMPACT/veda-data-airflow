name: CICD 🚀

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
    types: [ opened, reopened, edited, synchronize ]

jobs:
  pre-commit-check:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        name: Setup uv
        with:
          enable-cache: true

      - name: Run uv sync
        run: uv sync --locked --all-groups

      - name: Run Pre-commit
        run: uv run pre-commit run --all-files

  test-dags:
    name: Test Airflow DAGs 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        name: Setup uv
        with:
          enable-cache: true

      - name: Run uv sync
        run: uv sync --locked --all-groups

      - name: Test Airflow DAGs
        run: |
          export AIRFLOW_HOME=/tmp
          uv run airflow db migrate
          uv run pytest

  plan:
    name: 'Run `terraform plan` against development environment'
    runs-on: ubuntu-latest
    needs: [test-dags]
    environment: development
    concurrency: development
    permissions:
      id-token: write # Required to request OIDC token for use with AWS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: "true"
          submodules: "recursive"
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          role-session-name: "veda-airflow-github-development-planner"
          aws-region: us-west-2

      - name: Plan Changes
        uses: "./.github/actions/terraform-deploy-sm2a"
        with:
          dir: .
          env_aws_secret_name: ${{ vars.SM2A_ENVS_DEPLOYMENT_SECRET_NAME }}
          env-file: .env
          aws-region: us-west-2
          run_command: plan
